<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Monitor</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="webui.js"></script>
    <!-- TS Compiled -->
    <script src="main.js" type="module"></script>
</head>
<body>
    <div class="container mt-4">
        <h1 class="global-header mb-4">Монитор Ресурсов</h1>

        <!-- CPU -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">Процессор</div>
                    <div class="card-body">
                        <div class="mb-3">
                            <div class="d-flex justify-content-between">
                                <span>Общая загрузка</span>
                                <span id="cpuTotalText">0%</span>
                            </div>
                            <div class="progress" style="height: 30px;">
                                <div id="cpuTotalBar" class="progress-bar bg-primary" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                            </div>
                        </div>

                        <div id="coresContainer" class="row"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Memory -->
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">Память</div>
                    <div class="card-body">
                        <!-- RAM -->
                        <div class="mb-3">
                            <div class="d-flex justify-content-between">
                                <span>RAM</span>
                                <span id="ramText">0 / 0 kB</span>
                            </div>
                            <div class="progress">
                                <div id="ramBar" class="progress-bar bg-success" role="progressbar" style="width: 0%;"></div>
                            </div>
                        </div>
                        <!-- SWAP -->
                        <div>
                            <div class="d-flex justify-content-between">
                                <span>SWAP</span>
                                <span id="swapText">0 / 0 kB</span>
                            </div>
                            <div class="progress">
                                <div id="swapBar" class="progress-bar bg-warning" role="progressbar" style="width: 0%;"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
